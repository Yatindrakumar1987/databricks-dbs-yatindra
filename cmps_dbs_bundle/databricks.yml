# This is a Declarative Automation Bundle definition for cmps_dbs_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: cmps_dbs_bundle
  uuid: e2aba6de-9f8b-40bd-8e4c-0e230c883c5d

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b54b5d77-934d.cloud.databricks.com
    variables:
      catalog: cmps_dbs_main_dev
      schema: cmps
  prod:
    mode: production
    workspace:
      host: https://dbc-b54b5d77-934d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/yatindrakumar1987@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/yatindrakumar1987@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: cmps_dbs_main_prod
      schema: cmps
    permissions:
      - user_name: yatindrakumar1987@gmail.com
        level: CAN_MANAGE
